{% extends "base.html" %}
{% block content %}
<div class="card mx-auto p-4" style="max-width: 450px;">
    <h2>Create your TrustVault company</h2>
    <p class="text-muted">Register your organization and administrator account.</p>

    <form method="POST">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

        <label class="form-label">Your name</label>
        <input class="form-control mb-3" name="name" required>

        <label class="form-label">Company name</label>
        <input class="form-control mb-3" name="company" required>

        <label class="form-label">Email</label>
        <input class="form-control mb-3" type="email" name="email" required>

        <label class="form-label">Password (minimum 12 characters)</label>
        <input class="form-control mb-3" type="password"
               name="password" minlength="12" required>

        <button class="btn btn-primary w-100">Register</button>
    </form>

    <p class="mt-3">Already registered? <a href="/login">Login</a></p>
</div>
{% endblock %}
