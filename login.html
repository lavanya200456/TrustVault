{% extends "base.html" %}
{% block content %}
<div class="card mx-auto p-4" style="max-width: 420px;">
    <h2>Welcome to TrustVault</h2>
    <p class="text-muted">Sign in to access your documents.</p>

    <form method="POST">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

        <label class="form-label">Email</label>
        <input class="form-control mb-3" type="email"
               name="email" required>

        <label class="form-label">Password</label>
        <input class="form-control mb-3" type="password"
               name="password" required>

        <button class="btn btn-primary w-100">Login</button>
    </form>

    <p class="mt-3">New company? <a href="/register">Register</a></p>
</div>
{% endblock %}
